name: demo-session

# Manual-only: opens an interactive SSH session on a free arm64 GitHub-hosted
# runner via tmate, so you can build llama.cpp, start llama-server, and drive
# demo/demo_client.py live while screen-recording for the submission video.
# Nobody else can reach it — tmate prints a one-time SSH URL only you see in
# the job log, and the job self-terminates after `timeout_minutes`.

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Minutes to keep the session open"
        required: false
        default: "30"

jobs:
  demo:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kleidibench
        run: python -m pip install -e ".[hf]"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: ~/.kleidibench
          key: kleidibench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kleidibench/kleidibench/build.py') }}

      - name: Open SSH session for the live demo
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        timeout-minutes: ${{ fromJson(github.event.inputs.timeout_minutes) }}

      # Once connected (see the job log for the SSH command):
      #   1. kleidibench run <model>   (if the report isn't already built)
      #   2. bash demo/server.md steps -> start llama-server on 127.0.0.1:8080
      #      (tmate gives you a shell on the runner itself, so localhost works
      #      for screen-recording the terminal output directly)
      #   3. python demo/demo_client.py --stream "..."   while screen-recording
