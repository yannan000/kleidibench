# Cross-family sweep — models available immediately (all ungated).
# A failed model doesn't abort the sweep, so if llama.cpp's converter doesn't
# support Gemma 4's arch yet, the other two still land and we swap in
# gemma-3-4b-it as fallback.
#   Dispatch: Actions -> benchmark -> Run workflow -> config: configs/crossfamily.yaml

models:
  - HuggingFaceTB/SmolLM2-1.7B-Instruct
  - microsoft/Phi-3.5-mini-instruct   # 3.8B
  - google/gemma-4-E4B-it             # Gemma 4, 4.5B effective — benched last

quants:
  - Q8_0
  - Q4_K_M
  - Q4_0

threads:
  - 1
  - 2
  - 4

quality: true
