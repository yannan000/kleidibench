# KleidiBench multi-model leaderboard sweep.
# Run with:  kleidibench sweep configs/leaderboard.yaml
#
# All models here are small enough to run on an Oracle Always-Free Ampere A1
# (Neoverse N1, 2 OCPU / 12 GB post-June-2026). Comment/uncomment as your box
# allows. Q4_0 is the KleidiAI-accelerated format and is always included.

models:
  - meta-llama/Llama-3.2-1B    # fast headline; great for the live demo endpoint
  - meta-llama/Llama-3.2-3B    # default headliner (fits 12 GB comfortably)
  - Qwen/Qwen2.5-3B            # cross-family comparison
  # - microsoft/Phi-3.5-mini-instruct   # stretch: ~3.8B, watch RAM on 12 GB
  # - meta-llama/Llama-3.1-8B           # stretch: Q4 only, slow on free tier

# Quantization formats to sweep (F16 baseline is always produced automatically).
quants:
  - Q8_0
  - Q4_K_M
  - Q4_0

# Thread counts for the scaling curve. Keep <= your OCPU count.
threads:
  - 1
  - 2
