.sT{fill:#bdf0ff;font-size:10px}
.arrow{stroke:#3f484b;stroke-width:2;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8" fill="none" stroke="#3f484b" stroke-width="1.6"/></marker></defs>

<rect class="box" x="24" y="86" width="176" height="76" rx="10"/>
<text class="h" x="40" y="114">Model in</text>
