<text class="s" x="500" y="132">quants × builds × threads</text>
<text class="s" x="500" y="146">+ perplexity · + peak RSS</text>

<rect class="boxT" x="708" y="74" width="168" height="100" rx="10"/>
<text class="hT" x="724" y="100">Reports</text>
<text class="sT" x="724" y="120">report.html per model</text>
