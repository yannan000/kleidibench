<path class="arrow" d="M200,124 L244,124"/>
<path class="arrow" d="M436,124 L480,124"/>
<path class="arrow" d="M660,124 L704,124"/>

<rect x="24" y="204" width="852" height="66" rx="10" fill="#0c0e12" stroke="#2b3139"/>
<text x="40" y="230" fill="#82d2e7" font-size="12" font-weight="700">MEASURED, NOT CLAIMED</text>
<text x="40" y="252" fill="#bec8cc" font-size="12">KleidiAI Q8_0 prefill: up to 1.73&#215; · Arm kernels vs naive: up to 3.3&#215; · F16&#8594;Q4_0: 3.4&#215; smaller · run-to-run noise: 0.54% median</text>
